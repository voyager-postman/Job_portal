  <script type="text/javascript">

    const faqItems = document.querySelectorAll('.candidate-blank-form-detail-edit-info');

    faqItems.forEach(item => {
      item.classList.add('active');
    });

    faqItems.forEach(item => {

        item.classList.toggle('active');
      });
    });
